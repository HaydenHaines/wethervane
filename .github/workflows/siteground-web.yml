name: Validate SiteGround application

on:
  push:
    branches: [deploy/siteground]
  pull_request:
    branches: [deploy/siteground]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-site.txt
      - run: npm run test:snapshot
      - run: npm run test:tipping
      - run: npm run test:explorer-data
      - run: npm run test:composition
      - run: npm run test:poll-selection
      - run: npm run test:component-catalog
      - run: npm run test:scoreboard
      - run: npm run test:house
      - run: npm run test:explorer-state
      - run: npm run test:ribbon-layout
      - run: npm run catalog:build
      - run: npm run test:explorer-artifacts
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
